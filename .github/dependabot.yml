version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      dependencies:
        patterns: ["*"]
    ignore:
      # Tipos do Node acompanham a versão do runtime (.nvmrc), não a última publicada.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint ainda não suporta TS 7 (peer: <6.1). Rever quando suportar.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
